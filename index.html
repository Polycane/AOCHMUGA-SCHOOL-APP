<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AOCHMUGA SCHOOL MANAGEMENT SYSTEM</title><style>body{margin:0;font-family:Arial;background:#111;color:#fff}header{background:#d00;padding:18px;text-align:center;border-bottom:8px solid #111}nav{display:flex;gap:6px;flex-wrap:wrap;background:#080;padding:10px}button{padding:10px;border:0;border-radius:8px}main{padding:15px}.card{background:#fff;color:#111;padding:15px;margin:10px 0;border-radius:12px}input,select{padding:10px;margin:5px;width:90%;box-sizing:border-box}table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #aaa}.small{opacity:.8;font-size:.9em}</style></head><body><header><h2>AOCHMUGA SCHOOL</h2><b>SCHOOL MANAGEMENT SYSTEM</b><div>Hard Work Pays</div><div class=small>Rangwe Subcounty, Homa Bay County</div></header><nav><button onclick="show('dashboard')">Dashboard</button><button onclick="show('learners')">Learners</button><button onclick="show('marks')">Marks</button><button onclick="show('reports')">Reports</button><button onclick="show('settings')">Admin Settings</button></nav><main id=app></main><script>const areas=JSON.parse(localStorage.areas||'["English","Kiswahili","Mathematics","Integrated Science","Social Studies","Religious Education","Creative Arts & Sports"]');const learners=JSON.parse(localStorage.learners||'[]');const marks=JSON.parse(localStorage.marks||'{}');function save(){localStorage.areas=JSON.stringify(areas);localStorage.learners=JSON.stringify(learners);localStorage.marks=JSON.stringify(marks)}function grade(v){v=+v;if(v>=75)return'EE';if(v>=50)return'ME';if(v>=25)return'AE';return'BE'}function show(p){let a=document.getElementById('app');if(p==='dashboard')a.innerHTML='<div class=card><h2>Dashboard</h2><p>Learners: '+learners.length+'</p><p>Learning Areas: '+areas.length+'</p><p>Offline storage: Active</p></div>';if(p==='learners')a.innerHTML='<div class=card><h2>Learner Registration</h2><input id=n placeholder="Full name"><input id=g placeholder="Grade (PP1–Grade 9)"><button onclick="addL()">Register</button><hr>'+learners.map((x,i)=>'<p>'+(i+1)+'. '+x.name+' — '+x.grade+'</p>').join('')+'</div>';if(p==='marks')a.innerHTML='<div class=card><h2>Marks Entry</h2><select id=ln>'+learners.map(x=>'<option>'+x.name+'</option>').join('')+'</select><select id=sub>'+areas.map(x=>'<option>'+x+'</option>').join('')+'</select><input id=sc type=number min=0 max=100 placeholder="Score"><button onclick="addM()">Save Mark</button></div>';if(p==='reports')a.innerHTML='<div class=card><h2>CBC Report Preview</h2>'+ (learners.map(report).join('')||'<p>No learners registered.</p>')+'</div>';if(p==='settings')a.innerHTML='<div class=card><h2>Administrator Learning Areas</h2><input id=na placeholder="New learning area"><button onclick="addArea()">Add</button><ul>'+areas.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class=small>This starter stores data locally. Firebase, authentication, SMS and multi-school cloud sync require production implementation.</p></div>'}function addL(){let n=document.getElementById('n').value,g=document.getElementById('g').value;if(n){learners.push({name:n,grade:g});save();show('learners')}}function addM(){let n=document.getElementById('ln').value,s=document.getElementById('sub').value,v=document.getElementById('sc').value;if(!marks[n])marks[n]={};marks[n][s]=v;save();alert('Saved')}function addArea(){let x=document.getElementById('na').value;if(x&&!areas.includes(x)){areas.push(x);save();show('settings')}}function report(x){let m=marks[x.name]||{};return '<h3>'+x.name+' — '+x.grade+'</h3><table><tr><th>Learning Area</th><th>Score</th><th>Level</th></tr>'+Object.entries(m).map(([s,v])=>'<tr><td>'+s+'</td><td>'+v+'</td><td>'+grade(v)+'</td></tr>').join('')+'</table><p>Teacher Remark: ______________________________</p><p>Headteacher Comment: _________________________</p><button onclick="window.print()">Print Report</button>'}show('dashboard');</script></body></html>
